<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VYBE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%238b6cff'/%3E%3Cpath d='M13 22V10l10-2v11' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='10.500' cy='22' r='2.500' fill='white'/%3E%3Ccircle cx='20.500' cy='19' r='2.500' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">

    <!-- ============ Left: library and playlists ============ -->
    <aside class="sidebar">
      <h1 class="logo">VYBE</h1>

      <nav>
        <h2>Library</h2>
        <ul id="library-list">
          <li><button data-view="playlist" data-id="-1">
            <svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span>All Songs</span></button></li>
          <li><button data-view="playlist" data-id="-2">
            <svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21.2l8.8-8.8a5.5 5.5 0 0 0 0-7.8z"/></svg>
            <span>Liked Songs</span></button></li>
          <li><button data-view="recent">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span>Recently Played</span></button></li>
          <li><button data-view="queue">
            <svg viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h8M19 15v6M16 18h6"/></svg>
            <span>Queue</span></button></li>
        </ul>

        <h2>Playlists <button id="new-playlist" class="small" title="New playlist">+ New</button></h2>
        <ul id="playlist-list"></ul>
      </nav>
    </aside>

    <!-- ============ Middle: the songs of the open list ============ -->
    <main class="main">
      <header class="banner">
        <div id="list-cover" class="big-cover"></div>
        <div>
          <p class="kicker" id="list-kind">Playlist</p>
          <h2 id="list-title">All Songs</h2>
          <p id="list-info" class="muted"></p>
        </div>
      </header>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search by title or artist" autocomplete="off">
        <div id="list-actions" class="actions">
          <button id="shuffle-btn">Shuffle</button>
          <select id="sort-field" aria-label="Sort by">
            <option value="title">Title</option>
            <option value="artist">Artist</option>
            <option value="album">Album</option>
            <option value="genre">Genre</option>
            <option value="year">Year</option>
            <option value="duration">Length</option>
            <option value="plays">Most played</option>
            <option value="added">Date added</option>
          </select>
          <select id="sort-order" aria-label="Order">
            <option value="asc">A to Z / low to high</option>
            <option value="desc">Z to A / high to low</option>
          </select>
          <button id="sort-btn">Sort</button>
          <button id="rename-btn">Rename</button>
          <button id="delete-btn" class="danger">Delete</button>
        </div>
      </div>

      <div id="content"></div>
    </main>

    <!-- ============ Bottom: the player ============ -->
    <footer class="player">
      <div class="now">
        <img id="now-cover" alt="" hidden>
        <div>
          <div id="now-title">Nothing playing</div>
          <div id="now-artist" class="muted"></div>
        </div>
      </div>

      <div class="controls">
        <div class="buttons">
          <button id="prev-btn" title="Previous">&#9198;</button>
          <button id="play-btn" class="play" title="Play / pause">&#9654;</button>
          <button id="next-btn" title="Next">&#9197;</button>
          <button id="repeat-btn" title="Repeat">Repeat: off</button>
        </div>
        <div class="progress">
          <span id="time-now">0:00</span>
          <input id="seek" type="range" min="0" max="100" value="0" step="1" aria-label="Seek">
          <span id="time-total">0:00</span>
        </div>
      </div>

      <div class="volume">
        <input id="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="Volume">
      </div>
    </footer>
  </div>

  <!-- Pop-up used for "New playlist" and "Rename" -->
  <dialog id="name-dialog">
    <form method="dialog">
      <h3 id="name-dialog-title">New playlist</h3>
      <input id="name-input" maxlength="40" required>
      <!-- Save comes first so pressing Enter saves; CSS shows it on the right. -->
      <div class="dialog-buttons">
        <button value="ok" class="primary">Save</button>
        <button value="cancel" formnovalidate>Cancel</button>
      </div>
    </form>
  </dialog>

  <!-- Pop-up used for "Add to playlist" -->
  <dialog id="add-dialog">
    <form method="dialog">
      <h3>Add to playlist</h3>
      <div id="add-choices"></div>
      <div class="dialog-buttons">
        <button value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <audio id="audio" preload="auto"></audio>
  <script src="js/app.js"></script>
</body>
</html>
